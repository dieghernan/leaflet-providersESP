<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagen social de Leaflet-providersESP</title>
  <style>
    @font-face { font-family: Inter; src: url('./fonts/Inter.ttf'); font-weight: 100 900; }
    @font-face { font-family: 'Inter Tight'; src: url('./fonts/InterTight.ttf'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #22272e; color: #fff; font-family: Inter, sans-serif; }
    .map { position: absolute; inset: 0 0 0 36%; overflow: hidden; }
    .map img { width: 100%; height: 100%; object-fit: cover; object-position: 57% center; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #22272e 0%, #22272e 36%, #22272ed9 47%, #22272e00 77%); }
    main { position: absolute; inset: 10.3% 5%; }
    .copy { width: 44%; }
    .tag { font-size: 1.5625vw; font-weight: 600; color: #79b8ff; }
    h1 { font: 800 5.4vw/1.1 'Inter Tight', sans-serif; letter-spacing: -.13vw; margin: 4.5vw 0 2.7vw; }
    p { font-size: 2.15vw; line-height: 1.4; margin: 0; }
    footer { position: absolute; bottom: 0; left: 0; font-size: 1.5625vw; }
    .credit { position: absolute; right: 2%; bottom: 3%; color: #fff; background: #22272ef2; padding: .6em .9em; font-size: 1.015625vw; }
  </style>
</head>
<body>
  <div class="map"><img src="./social-map.jpg" alt="Cartografía de la península ibérica"></div>
  <div class="shade"></div>
  <main>
    <div class="copy">
      <div class="tag">MAPAS · WMS · WMTS</div>
      <h1>Leaflet-<br>providersESP</h1>
      <p>Cartografía pública de España<br>para tus mapas Leaflet.</p>
    </div>
    <footer>Explora las capas. Copia el código.</footer>
  </main>
  <span class="credit">Cartografía: IGN · CC BY 4.0</span>
</body>
</html>
