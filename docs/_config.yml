# Sitio del proyecto. Compilar con docs/ como directorio de trabajo.
remote_theme: dieghernan/chulapa
repository: dieghernan/leaflet-providersESP
url: https://dieghernan.github.io
baseurl: /leaflet-providersESP

locale: es-ES
og_locale: es_ES
timezone: Europe/Madrid
title: Leaflet-providersESP
subtitle: Cartografía pública de España para Leaflet
description: >-
  Mapas base, ortofotos y capas WMS y WMTS de organismos públicos de España para Leaflet. Explora proveedores y copia el código para tu mapa.

og_image: /assets/social-preview.jpg
og_image_alt: Leaflet-providersESP. Cartografía pública de España para mapas Leaflet, con un mapa de la península ibérica.
og_image_width: 1200
og_image_height: 630
og_image_type: image/jpeg

twitter_site: dhernangomez
gtag_id: G-B7DT123587

author:
  name: dieghernan
  url: https://dieghernan.github.io/
  avatar: https://dieghernan.github.io/assets/img/site/avatar.png
  location: Madrid, Spain
  links:
    - url: https://dieghernan.github.io/
      icon: fas fa-blog
      label: Web personal
    - url: https://github.com/dieghernan
      icon: fab fa-github
      label: GitHub
    - url: https://orcid.org/0000-0001-8457-4658
      icon: fa-brands fa-orcid
      label: ORCID
    - url: https://fosstodon.org/@dhernangomez
      icon: fa-brands fa-mastodon
      label: Mastodon
    - url: https://bsky.app/profile/dieghernan.bsky.social
      icon: fa-brands fa-square-bluesky
      label: Bluesky
    - url: https://x.com/dhernangomez
      icon: fab fa-square-x-twitter
      label: Twitter/X
    - url: https://stackoverflow.com/users/7877917/dieghernan
      icon: fab fa-stack-overflow
      label: Stack Overflow

publisher:
  type: Person
  name: dieghernan
  url: https://dieghernan.github.io/
  image: https://dieghernan.github.io/assets/img/site/avatar.png

fa_version: "6"

googlefonts:
  - url: https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap
  - url: https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap

chulapa-skin:
  skin: gitdev
  vars:
    font-family-monospace: Fira Code
    enable-responsive-font-sizes: true
  highlight: github

webmentions:
  endpoint: https://webmention.io/dieghernan.github.io/webmention
  pingback: https://webmention.io/dieghernan.github.io/xmlrpc

navbar:
  brand:
    title: '<i class="fas fa-home" aria-hidden="true" style="color: white"></i><span class="sr-only">Inicio</span>'

  nav:
    - title: Guía de uso
      url: /guia/
    - title: Preview
      url: /preview/
    - title: Visor
      url: /visor/
    - title: Cambios
      url: https://github.com/dieghernan/leaflet-providersESP/blob/main/CHANGELOG.md
    - title: GitHub
      url: https://github.com/dieghernan/leaflet-providersESP

footer:
  links:
    - label: dieghernan
      icon: fas fa-blog
      url: https://dieghernan.github.io/
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dieghernan/leaflet-providersESP
    - label: ORCID
      icon: fa-brands fa-orcid
      url: https://orcid.org/0000-0001-8457-4658
    - label: Mastodon
      icon: fa-brands fa-mastodon
      url: https://fosstodon.org/@dhernangomez
    - label: Bluesky
      icon: fa-brands fa-square-bluesky
      url: https://bsky.app/profile/dieghernan.bsky.social
    - label: Twitter/X
      icon: fab fa-square-x-twitter
      url: https://x.com/dhernangomez
    - label: Stack Overflow
      icon: fab fa-stack-overflow
      url: https://stackoverflow.com/users/7877917/dieghernan

defaults:
  - scope:
      path: ""
    values:
      layout: default
      header_type: base
      show_author: false
      show_date: false
      show_sociallinks: false
      show_webmentions: true
      include_on_search: false
      include_on_feed: false

plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .bundle
  - LICENSE

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..4

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  - global-builtin
  - color-functions
  - abs-percent
  - function-units

compress_html:
  clippings: all
  blanklines: true

strict_front_matter: true
