{%- assign map_title = page.title | append: ' | Leaflet-providersESP' -%}
{%- assign map_description = page.description | default: page.excerpt | default: site.description | strip_html | strip -%}
{%- assign map_image = site.og_image | absolute_url -%}
<title>{{ map_title | escape }}</title>
<meta name="description" content="{{ map_description | escape }}">
<meta name="theme-color" content="#22272e">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ map_title | escape }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:description" content="{{ map_description | escape }}">
<meta property="og:locale" content="{{ site.og_locale }}">
<meta property="og:image" content="{{ map_image }}">
<meta property="og:image:width" content="{{ site.og_image_width }}">
<meta property="og:image:height" content="{{ site.og_image_height }}">
<meta property="og:image:type" content="{{ site.og_image_type }}">
<meta property="og:image:alt" content="{{ site.og_image_alt | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ site.twitter_site }}">
<meta name="twitter:creator" content="@{{ site.twitter_site }}">
<meta name="twitter:title" content="{{ map_title | escape }}">
<meta name="twitter:description" content="{{ map_description | escape }}">
<meta name="twitter:image" content="{{ map_image }}">
<meta name="twitter:image:alt" content="{{ site.og_image_alt | escape }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/icon/favicon.svg' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/assets/icon/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icon/apple-touch-icon.png' | relative_url }}">
