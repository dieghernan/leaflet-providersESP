<main class="map-app" data-service="{{ page.map_service | default: '' }}">
  <h1 class="sr-only">{{ page.title }}</h1>
  <nav class="map-toolbar" aria-label="Navegación del visor">
    <a href="{{ '/' | relative_url }}">Inicio</a>
    <a href="{{ '/guia/' | relative_url }}">Guía de uso</a>
    <a href="{{ '/capas/' | relative_url }}">Referencia de capas</a>
    <a href="{{ '/preview/' | relative_url }}">Preview y código</a>
    <span>leaflet-providersESP · Visor</span>
  </nav>
  <details id="viewer-controls" class="viewer-controls" open>
    <summary>Añadir o quitar capas del selector <span id="registered-count"></span></summary>
    <div class="viewer-controls-content">
      <div class="ribbon-heading">
        <div class="ribbon-tabs" role="tablist" aria-label="Tipo de capa">
          <button id="backgrounds-tab" type="button" role="tab" aria-selected="true" aria-controls="backgrounds-panel" tabindex="0">Fondos</button>
          <button id="overlays-tab" type="button" role="tab" aria-selected="false" aria-controls="overlays-panel" tabindex="-1">Transparencias</button>
        </div>
        <label class="sr-only" for="layer-search">Buscar capas</label>
        <input id="layer-search" type="search" placeholder="Buscar capas…">
        <label class="sr-only" for="service-filter">Servicio</label>
        <select id="service-filter"><option value="">WMS y WMTS</option><option>WMS</option><option>WMTS</option></select>
      </div>
      <p class="ribbon-help">Marca las capas que quieras en el selector. En <strong>Capas</strong>, sobre el mapa, elige cuáles mostrar.</p>
      <div id="backgrounds-panel" class="ribbon-panel" role="tabpanel" aria-labelledby="backgrounds-tab"></div>
      <div id="overlays-panel" class="ribbon-panel" role="tabpanel" aria-labelledby="overlays-tab" hidden></div>
      <p id="layer-count" role="status" aria-live="polite"></p>
    </div>
  </details>
  <section class="map-stage" aria-label="Vista del mapa">
    <div id="map" role="region" aria-label="Mapa de España" tabindex="0"></div>
    <p id="map-status" class="map-status" role="status" aria-live="polite"></p>
  </section>
</main>
